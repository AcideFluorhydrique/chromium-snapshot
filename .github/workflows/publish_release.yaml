name: Publish Chromium Android snapshot

# Mirror official Google-built Chromium trunk snapshots (Android_Arm64) to GitHub Releases daily.
# No custom builds; the APK is mirrored unmodified, using the APK's internal versionName as the tag so Obtainium won't report false updates.
# 每天把 Google 官方編譯的 Chromium 主幹 snapshot（Android_Arm64）轉發成 GitHub Release。
# 不自己編譯；APK 原封不動，tag 用 APK 內的版號，Obtainium 才不會一直報假更新。

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PLATFORM: Android_Arm64
      BUCKET: https://www.googleapis.com/download/storage/v1/b/chromium-browser-snapshots/o
      # Public debug signing key built into Chromium source code
      # Chromium 原始碼內建的公開 debug 金鑰
      EXPECTED_CERT: 32a2fc74d731105859e5a85df16d95f102d85b22099b8064c5d8915c61dad1e0
      # Number of recent releases to keep
      # 只保留最近幾個 Release
      KEEP: 20
    steps:
      - name: Download latest snapshot
        run: |
          rev=$(curl -fsSL "$BUCKET/${PLATFORM}%2FLAST_CHANGE?alt=media")
          [[ "$rev" =~ ^[0-9]+$ ]] || { echo "bad LAST_CHANGE: $rev"; exit 1; }
          echo "REV=$rev" >> "$GITHUB_ENV"
          curl -fsSL -o chrome-android.zip "$BUCKET/${PLATFORM}%2F${rev}%2Fchrome-android.zip?alt=media"
          unzip -j chrome-android.zip chrome-android/apks/ChromePublic.apk

      - name: Read version and verify signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ver=$("$BT/aapt2" dump badging ChromePublic.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          [ -n "$ver" ] || { echo "cannot read versionName"; exit 1; }
          cert=$("$BT/apksigner" verify --print-certs ChromePublic.apk | sed -n 's/.*SHA-256 digest: //p' | head -1)
          echo "version $ver, revision $REV, cert $cert"
          [ "$cert" = "$EXPECTED_CERT" ] || { echo "unexpected signing certificate"; exit 1; }
          echo "VER=$ver" >> "$GITHUB_ENV"

      - name: Publish release
        run: |
          tag="v$VER"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already published"; exit 0
          fi
          mv ChromePublic.apk "chromium-$VER-r$REV-android-arm64.apk"
          notes=$(printf '%s\n\n%s' \
            "Official Chromium trunk snapshot built by Google, mirrored unmodified. Source: chromium-browser-snapshots/$PLATFORM/$REV. Package name: org.chromium.chrome, signed with Chromium's public debug key (SHA-256: $EXPECTED_CERT)." \
            "Google 官方編譯的 Chromium 主幹 snapshot，原封不動轉發。來源：chromium-browser-snapshots/$PLATFORM/$REV。包名 org.chromium.chrome，Chromium 公開 debug 金鑰簽名（SHA-256：$EXPECTED_CERT）。")
          gh release create "$tag" "chromium-$VER-r$REV-android-arm64.apk" -R "$GITHUB_REPOSITORY" \
            --title "Chromium $VER (r$REV)" \
            --notes "$notes"

      - name: Remove old releases
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            -q 'sort_by(.createdAt) | reverse | .[env.KEEP|tonumber:] | .[].tagName' \
          | while read -r t; do gh release delete "$t" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes; done
